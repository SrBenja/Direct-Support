name: Build and deploy Direct Support page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      deployment: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site with bank details from environment secrets
        env:
          TAKENOS_NAME: ${{ secrets.TAKENOS_NAME }}
          TAKENOS_GIVEN_NAMES: ${{ secrets.TAKENOS_GIVEN_NAMES }}
          TAKENOS_LAST_NAME: ${{ secrets.TAKENOS_LAST_NAME }}
          TAKENOS_BENEFICIARY_COUNTRY: ${{ secrets.TAKENOS_BENEFICIARY_COUNTRY }}
          TAKENOS_BENEFICIARY_STATE: ${{ secrets.TAKENOS_BENEFICIARY_STATE }}
          TAKENOS_BENEFICIARY_CITY: ${{ secrets.TAKENOS_BENEFICIARY_CITY }}
          TAKENOS_BENEFICIARY_POSTAL_CODE: ${{ secrets.TAKENOS_BENEFICIARY_POSTAL_CODE }}
          TAKENOS_BENEFICIARY_ADDRESS: ${{ secrets.TAKENOS_BENEFICIARY_ADDRESS }}
          TAKENOS_ACH_ACCOUNT: ${{ secrets.TAKENOS_ACH_ACCOUNT }}
          TAKENOS_ACH_ROUTING: ${{ secrets.TAKENOS_ACH_ROUTING }}
          TAKENOS_ACH_ACCOUNT_TYPE: ${{ secrets.TAKENOS_ACH_ACCOUNT_TYPE }}
          TAKENOS_ACH_BANK: ${{ secrets.TAKENOS_ACH_BANK }}
          TAKENOS_ACH_BANK_ADDRESS: ${{ secrets.TAKENOS_ACH_BANK_ADDRESS }}
          TAKENOS_SEPA_IBAN: ${{ secrets.TAKENOS_SEPA_IBAN }}
          TAKENOS_SEPA_BIC: ${{ secrets.TAKENOS_SEPA_BIC }}
          TAKENOS_SEPA_BANK: ${{ secrets.TAKENOS_SEPA_BANK }}
          TAKENOS_SEPA_BANK_ADDRESS: ${{ secrets.TAKENOS_SEPA_BANK_ADDRESS }}
        run: python3 -I build.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
