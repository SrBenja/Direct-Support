name: Build and deploy Direct Support page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build site with bank details from repository secrets
        env:
          TAKENOS_NAME: ${{ secrets.TAKENOS_NAME }}
          TAKENOS_ACH_ACCOUNT: ${{ secrets.TAKENOS_ACH_ACCOUNT }}
          TAKENOS_ACH_ROUTING: ${{ secrets.TAKENOS_ACH_ROUTING }}
          TAKENOS_ACH_ACCOUNT_TYPE: ${{ secrets.TAKENOS_ACH_ACCOUNT_TYPE }}
          TAKENOS_ACH_BANK: ${{ secrets.TAKENOS_ACH_BANK }}
          TAKENOS_ACH_BANK_ADDRESS: ${{ secrets.TAKENOS_ACH_BANK_ADDRESS }}
          TAKENOS_SEPA_IBAN: ${{ secrets.TAKENOS_SEPA_IBAN }}
          TAKENOS_SEPA_BIC: ${{ secrets.TAKENOS_SEPA_BIC }}
          TAKENOS_SEPA_BANK: ${{ secrets.TAKENOS_SEPA_BANK }}
          TAKENOS_SEPA_BANK_ADDRESS: ${{ secrets.TAKENOS_SEPA_BANK_ADDRESS }}
        run: python build.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
